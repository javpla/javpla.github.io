<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Published Apps</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --border: #1f2937;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 14px 28px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 5.5vw, 2rem);
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.97rem;
    }

    .apps {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .app-link {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      min-height: 72px;
    }

    .app-link:active { transform: scale(0.99); }
    .app-link:hover { border-color: var(--accent); }

    .name {
      margin: 0;
      font-size: 1.04rem;
      font-weight: 600;
    }

    .path {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.9rem;
      word-break: break-all;
    }

    @media (min-width: 640px) {
      .apps { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Published Apps</h1>
    <p>Quick access to deployed artifacts in this repository.</p>

    <section class="apps">
      <a class="app-link" href="./remind/index.html">
        <h2 class="name">ReMind</h2>
        <div class="path">/remind/index.html</div>
      </a>

      <a class="app-link" href="./trivia/index.html">
        <h2 class="name">Trivia</h2>
        <div class="path">/trivia/index.html</div>
      </a>

      <a class="app-link" href="./twister-spin/index.html">
        <h2 class="name">Twister Spin</h2>
        <div class="path">/twister-spin/index.html</div>
      </a>

      <a class="app-link" href="./recetas/index.html">
        <h2 class="name">Recetas</h2>
        <div class="path">/recetas/index.html</div>
      </a>
    </section>
  </main>
</body>
</html>
